# What GitHub Actions is allowed to do in the cluster: roll out a new image of
# this one deployment, and watch it come up. Nothing outside the "notes"
# namespace, no secrets, no pods/exec.
#
# Note that being able to change the image of a deployment is being able to
# run code in this namespace, with the data volume and the invite code. That
# is what deploying means; it is why the namespace holds nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: notes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: notes
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: notes
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: notes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
---
# A long-lived token for the service account, for the KUBECONFIG secret.
# Deleting this secret revokes it.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: notes
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
