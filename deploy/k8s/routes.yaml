# Public address: https://notes.magical.rocks
# Needs a DNS record for that name pointing at the ingress of the cluster.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: notes-tls-secret
  namespace: notes
spec:
  secretName: notes-tls-secret
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - notes.magical.rocks
---
# The design asks for TLS 1.3 only. The server enforces that itself when it
# terminates TLS; here Traefik does, so Traefik has to enforce it.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: tls13-only
  namespace: notes
spec:
  minVersion: VersionTLS13
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: notes
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# The server only sends HSTS when it terminates TLS itself.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: notes
spec:
  headers:
    stsSeconds: 63072000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: notes-http
  namespace: notes
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`notes.magical.rocks`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: notes-syncd
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: notes-https
  namespace: notes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`notes.magical.rocks`)
      kind: Rule
      middlewares:
        - name: hsts
      services:
        - name: notes-syncd
          port: 8080
  tls:
    secretName: notes-tls-secret
    options:
      name: tls13-only
      namespace: notes
