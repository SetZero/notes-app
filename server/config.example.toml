# notes-syncd configuration. Copy to config.toml and adjust.
# Start with:  notes-syncd config.toml

[server]
# Address to listen on.
listen = "127.0.0.1:8443"
# Where the SQLite database and the encrypted attachments are stored.
data_dir = "./data"
# Optional. Default is a SQLite file inside data_dir.
# database_url = "postgres://notes:password@localhost/notes"
# Without a [tls] section the server only starts on a loopback address,
# unless this is set because a reverse proxy terminates TLS in front of it.
allow_plain_http = false
# Peers whose X-Forwarded-For header is trusted (your reverse proxy): single
# addresses or CIDR ranges, e.g. ["127.0.0.1"] or ["10.42.0.0/16"].
trusted_proxies = []
# Optional directory with the built web app, served at /.
# static_dir = "./web"

# TLS 1.3 only. Certificate chain and private key in PEM format.
# [tls]
# cert = "cert.pem"
# key = "key.pem"

[enrollment]
# Who may create an account: "invite", "oidc" or "either".
mode = "invite"
# At least 16 characters. Better: leave it out here and set the
# environment variable NOTES_SYNCD_INVITE_CODE instead.
# invite_code = "change-me-to-a-long-random-string"

# OpenID Connect providers, e.g. Keycloak. Used when mode is "oidc" or "either".
# The client obtains an ID token (authorization code flow with PKCE, or the
# device flow) using a nonce from POST /v1/auth/oidc/nonce and sends it along.
# [[oidc]]
# id = "keycloak"
# issuer = "https://keycloak.example.com/realms/notes"
# client_id = "notes-app"
# scopes = ["openid"]
# algorithms = ["RS256"]
# Optional: only accept tokens that carry this claim (string or array member).
# required_claim = { name = "groups", value = "notes-users" }

[limits]
# All optional; these are the defaults.
# max_batch_blocks = 100
# max_block_ciphertext_bytes = 65536
# max_request_bytes = 1048576
# max_blob_bytes = 26214400
# max_account_blob_bytes = 5368709120
# max_clock_skew_seconds = 600
