[package]
name = "notes-web"
version = "0.1.0"
edition = "2021"
description = "Web build of the notes core: the HAL adapter for browsers and the bindings the page calls."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
notes-core = { path = "../../../common/core" }
# Must be the same version as the wasm-bindgen command line tool (see package.json, script "wasm").
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
